include: package:flutter_lints/flutter.yaml

plugins:
  riverpod_lint: 3.1.9

analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - docs/internal/**
    - lib/**/*.g.dart
    - lib/l10n/app_localizations*.dart
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - third_party/audio_service/**
    - third_party/audioplayers_android/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
linter:
  rules:
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_types_as_parameter_names: true
    strict_top_level_inference: true
    type_annotate_public_apis: true
    cancel_subscriptions: true
    close_sinks: true
    # Reports top-level declarations unreachable from the `main` of an
    # analyzed executable library (the app entry point and test files). It does
    # not detect unused public members of library files, such as services or
    # providers, which have no `main` of their own.
    unreachable_from_main: true
